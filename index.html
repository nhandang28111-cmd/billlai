<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BitTap PnL Mockup Random BG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="controls">
      <div class="title">
        <div class="mark">BT</div>
        <div>
          <h1>BitTap PnL Mockup</h1>
          <p>Random avatar · random nền · tải ảnh 4K</p>
        </div>
      </div>

      <div class="box">
        <div class="box-title">Thông tin lệnh</div>

        <div class="grid">
          <label>Coin
            <input id="coin" value="BTC-USDT-M">
          </label>
          <label>Lệnh
            <select id="side">
              <option value="Long" selected>Long / Nhiều</option>
              <option value="Short">Short / Ngắn</option>
            </select>
          </label>
        </div>

        <div class="grid">
          <label>Đòn bẩy
            <input id="lev" type="number" value="75">
          </label>
          <label>Vốn USDT
            <input id="capital" type="number" value="470.5" step="0.01">
          </label>
        </div>

        <div class="grid">
          <label>Giá vào
            <input id="entry" type="number" value="70575.9" step="0.1">
          </label>
          <label>Giá hiện tại
            <input id="markPrice" type="number" value="74344.0" step="0.1">
          </label>
        </div>

        <div class="grid">
          <label>Tên ẩn
            <input id="userName" value="****717">
          </label>
          <label>Mã mời
            <input id="invite" value="64QUJHK3">
          </label>
        </div>

        <label>Thời gian
          <div class="inline">
            <input id="time">
            <button id="nowBtn" type="button">Lấy giờ</button>
          </div>
        </label>

        <label>QR text/link
          <input id="qrText" value="https://t.me/logancrypto">
        </label>

        <div class="actions">
          <button id="createBtn" type="button">Tạo ảnh</button>
          <button id="avatarBtn" type="button">Random avatar</button>
          <button id="bgBtn" type="button">Random nền</button>
          <button id="allBtn" type="button">Random full</button>
          <button id="downloadBtn" type="button">Tải PNG 4K</button>
        </div>
      </div>
    </section>

    <section class="preview">
      <div id="bill" class="bill">
        <div class="top">
          <div class="profile">
            <div class="avatar">
              <img id="avatarImg" src="assets/avatar/avatar1.png" alt="avatar">
            </div>
            <strong id="outName">****717</strong>
          </div>
          <strong id="outTime">2026-04-14 09:26:47</strong>
        </div>

        <div id="mainArea" class="main bg-rocket">
          <h2 id="outCoin">BTC-USDT-M Không kỳ hạn</h2>

          <div class="badges">
            <span id="outSide" class="badge long">Nhiều</span>
            <span id="outLev" class="badge lev">75X</span>
          </div>

          <div id="outPnl" class="pnl profit">+1,884.01 <small>USDT</small></div>
          <div id="outRoi" class="roi profit">+400.42%</div>

          <div class="prices">
            <div><span>Giá mở lệnh</span><b id="outEntry">70,575.9</b></div>
            <div><span id="priceText">Giá đánh dấu</span><b id="outMark">74,344.0</b></div>
          </div>

          <div class="mockup-note">MARKETING MOCKUP</div>
        </div>

        <div class="bottom">
          <div class="bottom-left">
            <p>Mã mời <b id="outInvite">64QUJHK3</b></p>
            <div class="brand-row">
              <img src="assets/logo.png" class="brand-logo" alt="logo">
              <span>BitTap</span>
            </div>
          </div>
          <img id="qr" class="qr" alt="qr">
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
